<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Parse | Edge Reading</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app-container">
        <!-- Dashboard View -->
        <main id="view-dashboard" class="view active">
            <header class="app-header">
                <div class="logo">PARSE</div>
                <div class="header-actions">
                    <button class="icon-btn" id="add-btn" title="Add URL">+</button>
                    <button class="icon-btn" id="settings-btn" title="Settings">⚙</button>
                    <div class="theme-toggle" id="theme-toggle">◑</div>
                </div>
            </header>

            <section class="library-section">
                <div class="library-header">
                    <h2>Library</h2>
                    <div class="library-tools">
                        <div class="filter-toggle" id="filter-toggle">
                            <button class="filter-btn active" data-filter="active">Active</button>
                            <button class="filter-btn" data-filter="archived">Archived</button>
                        </div>
                        <div class="search-box">
                            <input type="text" id="search-input" placeholder="Search...">
                        </div>
                    </div>
                </div>
                
                <div id="articles-grid" class="articles-grid">
                    <!-- Loading skeleton -->
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </section>
        </main>

        <!-- Article Reader View -->
        <main id="view-article" class="view">
            <nav class="app-header reader-header">
                <button id="btn-back" class="icon-btn">←</button>
                <div class="reader-controls">
                <button class="icon-btn" id="btn-tts" title="Read Aloud">▶</button>
                <button class="icon-btn" id="btn-unsubscribe" title="Unsubscribe" hidden>⊖</button>
                <button class="icon-btn" id="btn-summarize" title="Summarize">✨</button>
                <button class="icon-btn" id="btn-archive" title="Archive">☑</button>
                <button class="icon-btn btn-danger" id="btn-delete" title="Delete">🗑️</button>
                <button class="icon-btn font-btn" data-action="decrease">A-</button>
                <button class="icon-btn font-btn" data-action="increase">A+</button>
                <button class="icon-btn font-btn" data-action="serif">T</button>
            </div>
        </nav>
        
        <div id="reader-content" class="reader-content typography-sans">
            <div class="reader-loading">
                <div class="spinner large"></div>
            </div>
        </div>
    </main>
    
    <!-- Clipping / Share View -->
    <main id="view-clipping" class="view">
        <div class="clipping-container">
            <div id="clipping-spinner" class="spinner large"></div>
            <div id="clipping-icon" class="clipping-icon hidden">✓</div>
            <h2 id="clipping-status">Clipping...</h2>
            <div id="clipping-error" class="error-msg hidden"></div>
            <div class="clipping-actions hidden" id="clipping-actions">
                <button id="btn-clip-retry" class="btn hidden">Retry</button>
                <button id="btn-clip-library" class="btn">Go to Library</button>
            </div>
        </div>
    </main>
</div>

<!-- Add URL Bottom Sheet -->
<div id="add-sheet" class="bottom-sheet">
    <div class="sheet-backdrop"></div>
    <div class="sheet-content">
        <div class="sheet-header">
            <h3>New Article</h3>
            <button id="close-sheet" class="icon-btn">✕</button>
        </div>
        <form id="parse-form" class="parse-form">
            <div class="input-group">
                <input type="url" id="url-input" placeholder="https://..." required>
                <button type="submit" id="submit-btn">
                    <span class="btn-text">Parse</span>
                    <div class="spinner hidden"></div>
                </button>
            </div>
            <div id="error-message" class="error-msg"></div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const addBtn = document.getElementById('add-btn');
        const addSheet = document.getElementById('add-sheet');
        const closeSheet = document.getElementById('close-sheet');
        const sheetBackdrop = document.querySelector('.sheet-backdrop');
        const parseFormEl = document.getElementById('parse-form');
        const urlInput = document.getElementById('url-input');
        
        const openSheet = () => { 
            addSheet.classList.add('active'); 
            setTimeout(() => urlInput.focus(), 100); 
        };
        const closeSheetFn = () => addSheet.classList.remove('active');
        
        addBtn.addEventListener('click', openSheet);
        closeSheet.addEventListener('click', closeSheetFn);
        sheetBackdrop.addEventListener('click', closeSheetFn);
        
        parseFormEl.addEventListener('submit', () => setTimeout(closeSheetFn, 300));
    });
</script>

<!-- Sleek Glassmorphic Floating TTS Player Sheet -->
<!-- Kept outside .view so its position:fixed is relative to the viewport, not a transformed ancestor -->
<div id="tts-player" class="tts-player-panel hidden">
    <div class="player-blur-bg"></div>
    <div class="player-progress-container" id="player-progress-area">
        <div class="player-progress-bar" id="player-progress"></div>
    </div>
    <div class="player-content">
        <div class="player-info">
            <div class="player-artwork" id="player-art">
                <span class="player-art-icon">🎙️</span>
            </div>
            <div class="player-metadata">
                <div class="player-title" id="player-title">Article Title</div>
                <div class="player-author" id="player-author">By Author</div>
            </div>
        </div>

        <div class="player-controls-group">
            <button class="player-icon-btn" id="player-prev" title="Previous Sentence">⏮</button>
            <button class="player-icon-btn" id="player-rewind" title="Rewind 15s">⏪</button>
            <button class="player-icon-btn player-play-btn" id="player-play-pause" title="Play">▶</button>
            <button class="player-icon-btn" id="player-forward" title="Forward 15s">⏩</button>
            <button class="player-icon-btn" id="player-next" title="Next Sentence">⏭</button>
        </div>

        <div class="player-extra">
            <div class="select-wrapper">
                <select id="player-speed" class="player-select" title="Playback Speed">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1.0x</option>
                    <option value="1.2">1.2x</option>
                    <option value="1.5">1.5x</option>
                    <option value="1.75">1.75x</option>
                    <option value="2">2.0x</option>
                </select>
            </div>
            <div class="select-wrapper">
                <select id="player-voice" class="player-select" title="Voice Selection">
                    <option value="">System Default</option>
                </select>
            </div>
            <button class="player-close-btn" id="player-close" title="Close Player">×</button>
        </div>
    </div>
</div>

    <!-- Settings Modal -->
    <div id="token-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="settings-close-btn" class="modal-close-btn" title="Close Settings">×</button>
            </div>
            
            <div class="settings-group">
                <label for="token-input">API Token</label>
                <p class="settings-help">Enter your <code>PARSE_TOKEN</code> secret to access your library. This is stored only in your browser.</p>
                <input type="password" id="token-input" placeholder="Paste token here..." autocomplete="off" spellcheck="false">
            </div>

            <div id="token-error" class="error-msg"></div>
            
            <div class="modal-footer">
                <button id="token-cancel-btn" class="token-cancel-btn">Cancel</button>
                <button id="token-save-btn" class="token-save-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
