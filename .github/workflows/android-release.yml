name: Android Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Publish Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Extract version info
        id: version
        run: |
          # Extract version name by removing 'v' from tag, e.g. v1.2.3 -> 1.2.3
          VERSION_NAME=${GITHUB_REF#refs/tags/v}
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          # Use the GitHub Actions run number as the version code
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Install dependencies & Build Web
        env:
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode --ignore-garbage > android/app/release.keystore

      - name: Build APK and AAB
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: Release ${{ env.VERSION_NAME }}
          draft: true
          prerelease: false
          generate_release_notes: true

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.twenty3p.parse
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          tracks: internal
          status: draft
